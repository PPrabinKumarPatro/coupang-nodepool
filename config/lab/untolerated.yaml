apiVersion: v1
kind: Pod
metadata:
  name: untolerated-demo
  namespace: nodepool-demo
spec:
  nodeSelector:
    nodes.example.com/nodepool: lab-demo
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10.2
    imagePullPolicy: Never
    resources:
      requests:
        cpu: 10m
        memory: 8Mi
      limits:
        cpu: 50m
        memory: 16Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
